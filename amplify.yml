version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - export VITE_AWS_REGION="${VITE_AWS_REGION:-us-west-2}"
        - export VITE_COGNITO_USER_POOL_ID="${VITE_COGNITO_USER_POOL_ID:-us-west-2_jJs1JIarh}"
        - export VITE_COGNITO_CLIENT_ID="${VITE_COGNITO_CLIENT_ID:-6j3dpm8g95pa2uuevfuk206qdi}"
        - test -n "$VITE_API_BASE_URL" || (echo "VITE_API_BASE_URL must be set to the AWS API Gateway URL" >&2; exit 1)
        - export VITE_API_BASE_URL
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
