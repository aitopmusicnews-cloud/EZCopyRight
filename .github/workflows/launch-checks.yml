name: Launch checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Block high or critical dependency advisories
        run: npm audit --audit-level=high

      - name: Run API tests
        run: npm run test:api

      - name: Build production frontend
        run: npm run build

      - name: Build Fargate API image
        run: docker build -f Dockerfile.api -t ez-copyright-api:ci .

      - name: Install pinned AWS infrastructure dependencies
        working-directory: infrastructure
        run: npm install --ignore-scripts

      - name: Audit AWS infrastructure dependencies
        working-directory: infrastructure
        run: npm audit --audit-level=high

      - name: Synthesize AWS production stack
        working-directory: infrastructure
        run: npm run synth -- -c s3BucketName=ez-copyright-ci-placeholder -c desiredCount=0
