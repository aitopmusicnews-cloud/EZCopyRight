name: Operations agent checks
on:
  pull_request:
    paths: ['operations-agent/**', '.github/workflows/operations-agent.yml']
  push:
    branches: [main]
    paths: ['operations-agent/**', '.github/workflows/operations-agent.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: operations-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: operations-agent/package-lock.json
      - name: Regenerate lockfile for dependency update
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations-agent/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update operations agent dependency lockfile"
            git push origin HEAD:codex/ezcopyright-agent-rds-iam
          fi
      - run: npm ci
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high
